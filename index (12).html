<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện thi Vật lí – Tổng hợp lực và cân bằng lực</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f7f3;--card:#fff;--ink:#16261d;--mute:#58695e;--line:#d3e2d8;--navy:#1f6b45;--blue:#e3f2e8;--acc:#d9822b;--ok:#1e8e5a;--okbg:#e3f4ec;--bad:#c93a3a;--badbg:#fbe9e9;--warn:#fff4e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a13;--card:#15241b;--ink:#e6f1ea;--mute:#9bb2a4;--line:#2a4636;--navy:#7fd0a0;--blue:#1b3328;--okbg:#14382a;--badbg:#44201f;--warn:#3d2f14}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:.6rem 1.25rem;border-radius:999px;cursor:pointer;font-weight:600;box-shadow:0 1px 2px rgba(16,40,28,.06);transition:transform .1s,background .15s,box-shadow .15s}.btn:hover{box-shadow:0 4px 14px rgba(16,40,28,.12)}
.btn:hover{background:var(--blue)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.pri:hover{filter:brightness(1.12)}
:root:not([data-theme=light]) .btn.pri{color:#0f1624}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:1rem}
header.top{background:var(--card);color:var(--ink);padding:.8rem 1rem;border-bottom:1px solid var(--line)}
:root:not([data-theme=light]) header.top{background:#1b3328;color:var(--ink)}
header.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:0 1rem}
.card{background:var(--card);border:1px solid transparent;border-radius:20px;padding:1.5rem;box-shadow:0 1px 2px rgba(16,40,28,.05),0 10px 30px rgba(16,40,28,.07)}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}h1{font-size:1.8rem}
.grid{display:grid;gap:1rem}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat b{font-size:1.6rem;display:block;color:var(--navy)}
.tag{display:inline-block;background:var(--blue);color:var(--navy);border-radius:999px;padding:.15rem .75rem;font-size:.85rem;font-weight:600}
label{display:block;font-weight:600;margin:.7rem 0 .25rem}
input[type=text]{width:100%;padding:.7rem .95rem;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.err{color:var(--bad);font-size:.9rem;min-height:1.2rem}
.flagbox{background:var(--warn);border-left:4px solid var(--acc);padding:.6rem .9rem;border-radius:6px;margin:.6rem 0;font-size:.95rem}
.hero{background:#17583a;color:#fff;padding:2rem}.hero h1{font-size:2.1rem;letter-spacing:-.02em}.hero p{color:#d3ebdd}.hero .stat b{color:#fff}.hero .stat{background:rgba(255,255,255,.12);padding:.8rem 1rem;border-radius:14px}
/* exam */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);box-shadow:0 4px 20px rgba(16,40,28,.08)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;justify-content:space-between;padding:.6rem 1rem}
#clock{font-variant-numeric:tabular-nums;font-size:1.4rem;font-weight:700;color:var(--navy);background:var(--blue);padding:.25rem 1rem;border-radius:999px}
#clock.warn{background:var(--acc);color:#fff}
.layout{display:grid;grid-template-columns:250px 1fr;gap:1rem}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;margin:.7rem 0}
.pal button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;position:relative}
.pal .done{background:var(--navy);color:#fff;border-color:var(--navy)}
:root:not([data-theme=light]) .pal .done{color:#0f1624}
.pal .cur{outline:3px solid var(--acc);outline-offset:1px}
.pal .mk::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.pal .ok{background:var(--okbg);border-color:var(--ok)}.pal .no{background:var(--badbg);border-color:var(--bad)}
.stats{font-size:.92rem;color:var(--mute)}.stats div{display:flex;justify-content:space-between}
.qtext{white-space:pre-line;font-size:1.2rem;font-weight:500;line-height:1.6}.zoom .qtext,.zoom .opt{font-size:1.4rem}
.opt{display:flex;gap:.8rem;width:100%;text-align:left;padding:1rem 1.1rem;margin:.6rem 0;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;transition:background .15s,border-color .15s}
.opt:hover{border-color:var(--navy)}
.opt i{font-style:normal;font-weight:700;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none;color:var(--navy)}
.opt.sel{background:var(--blue);border-color:var(--navy)}
.opt.sel i{background:var(--navy);color:#fff}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.sp{flex:1}
#tools{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));width:260px;max-width:calc(100% - 2rem);z-index:6}
#tools .card{padding:.8rem;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}.calc .btn{padding:.45rem}
textarea{width:100%;height:110px;padding:.5rem;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:grid;place-items:center;z-index:9;padding:1rem}
.modal .card{max-width:440px;width:100%}
.score{font-size:3.4rem;font-weight:700;color:var(--navy);line-height:1}
details{margin-top:.8rem;border:none;border-radius:14px;padding:.8rem 1.1rem;background:var(--blue)}
summary{cursor:pointer;font-weight:600}
mark{background:#ffe08a;color:#000}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:.4rem;text-align:left}
@media print{header,.bar,.row,#tools,.noprint{display:none!important}}
</style>
</head>

<header class="top"><div class="wrap"><strong style="font-size:1.1rem;display:flex;align-items:center;gap:.6rem;color:var(--navy)"><span style="width:28px;height:28px;border-radius:9px;background:var(--navy);display:inline-block"></span>Luyện thi Vật lí</strong><span>Vật lí</span></div></header>
<main id="app" class="wrap"></main>
<div id="tools" hidden></div>

{id:9,topic:"Tổng hợp lực",lv:"Thông hiểu",t:"Khi hai lực F₁, F₂ đồng quy, tạo thành 2 cạnh của một hình bình hành thì lực tổng hợp F có thể",o:["có điểm đặt tại 1 đỉnh bất kì của hình bình hành.","có phương trùng với đường chéo của hình bình hành.","có độ lớn F = F₁ + F₂.","cùng chiều với F₁ hoặc F₂."],a:1,s:NOSOL},
{id:10,topic:"Lực đồng quy",lv:"Nhận biết",t:"Ba lực đồng quy là ba lực có",o:["cùng độ lớn.","cùng chiều.","giá của các lực cắt nhau.","giá của các lực không cắt nhau."],a:2,s:NOSOL},

{id:13,topic:"Tổng hợp lực",lv:"Vận dụng",t:"Một vật nhỏ đồng thời chịu tác dụng của hai lực F₁, F₂ vuông góc với nhau. Biết độ lớn của hợp lực là 50 N và F₁ = 40 N thì độ lớn của F₂ là",o:["90 N.","45 N.","30 N.","10 N."],a:2,s:"Hai lực vuông góc nên: F₂ = √(F² − F₁²) = √(50² − 40²) = 30 N.<br><b>Đáp án: 30 N.</b>"},
{id:14,topic:"Tổng hợp lực",lv:"Thông hiểu",t:"Gọi F₁ và F₂ là độ lớn của hai lực thành phần, F là độ lớn hợp lực của chúng. Trong mọi trường hợp, ta có",o:["F luôn luôn lớn hơn cả F₁ và F₂.","F luôn luôn nhỏ hơn cả F₁ và F₂.","F thỏa mãn |F₁ – F₂| ≤ F ≤ F₁ + F₂.","F không bao giờ bằng F₁ hoặc F₂."],a:2,s:NOSOL},
{id:15,topic:"Tổng hợp lực",lv:"Vận dụng",t:"Cho hai lực đồng qui có cùng độ lớn 600 N. Để độ lớn hợp lực bằng 600 N thì góc hợp bởi giữa hai lực đó có giá trị là",o:["0°.","90°.","180°.","120°."],a:null,s:NOSOL},
{id:16,topic:"Cân bằng lực",lv:"Vận dụng",t:"Một vật nhỏ đồng thời chịu tác dụng của ba lực cùng nằm trong một mặt phẳng, có độ lớn bằng nhau và từng đôi một làm thành góc 120°. Độ lớn hợp lực của chúng là",o:["0 N.","F₁.","2F₁.","3F₁."],a:0,s:"Ba lực có cùng độ lớn và từng đôi một hợp với nhau góc 120° nên chúng cân bằng nhau.<br><b>Đáp án: F = 0 N.</b>"},
{id:17,topic:"Cân bằng lực",lv:"Thông hiểu",t:"Một sợi dây có khối lượng không đáng kể, một đầu được giữ cố định, đầu kia có gắn một vật nặng có khối lượng m. Vật đứng yên cân bằng. Khi đó",o:["vật chỉ chịu tác dụng của trọng lực.","vật chịu tác dụng của trọng lực, lực ma sát và lực căng dây.","vật chịu tác dụng của ba lực và hợp lực của chúng bằng không.","vật chịu tác dụng của trọng lực và lực căng dây."],a:3,s:NOSOL},
{id:18,topic:"Cân bằng lực",lv:"Nhận biết",t:"Các lực tác dụng lên một vật gọi là cân bằng khi",o:["hợp lực của tất cả các lực tác dụng lên vật bằng không.","hợp lực của tất cả các lực tác dụng lên vật là hằng số khác không.","vật chuyển động với gia tốc không đổi.","vật đứng yên."],a:0,s:NOSOL},
{id:19,topic:"Cân bằng lực",lv:"Thông hiểu",t:"Hai lực tác dụng lên một vật là hai lực cân bằng khi không thể",o:["cùng phương.","cùng hướng.","cùng giá.","cùng độ lớn."],a:1,s:NOSOL},
{id:20,topic:"Cân bằng lực",lv:"Thông hiểu",t:"Một vật nhỏ chịu tác dụng của ba lực F₁, F₂ và F₃ đồng phẳng. Để 3 lực trên cân bằng nhau thì",o:["tổng của hai lực cân bằng với lực còn lại.","ba lực đồng quy.","ba lực đồng quy và F₁ + F₂ = −F₃.","F₁ + F₂ = F₃."],a:2,s:NOSOL},
{id:21,topic:"Cân bằng lực",lv:"Vận dụng",t:"Một vật nằm cân bằng chịu tác dụng của ba lực đồng quy, đồng phẳng có độ lớn lần lượt là 12 N, 20 N và 16 N. Nếu bỏ lực có độ lớn 20 N thì hợp lực của hai lực còn lại có độ lớn là",o:["4 N.","20 N.","12 N.","15 N."],a:1,s:"Vật cân bằng nên hợp lực của ba lực bằng 0. Do đó, hợp lực của hai lực còn lại có độ lớn bằng lực thứ ba."},

const BANK=ALL;
const EXAM={title:"Tổng hợp lực và cân bằng lực",chapter:"Tổng hợp lực và cân bằng lực",minutes:30};

/* ============ 2. LƯU TRỮ (localStorage; có thể thay bằng Firebase/Supabase) ============ */
const Store={
 get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let A=Store.get("vl2_attempt",null), timer=null, curStep="home";

/* ============ 3. LOGIC BÀI THI ============ */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const q=id=>BANK.find(x=>x.id===id);
function newAttempt(u,sh,mode){
 const ids=BANK.map(x=>x.id);
 A={...u,start:Date.now(),mode:mode||"exam",checked:{},limit:EXAM.minutes*60,order:sh?shuffle(ids):ids,
  perm:Object.fromEntries(ids.map(i=>[i,sh?shuffle([0,1,2,3]):[0,1,2,3]])),
  ans:{},marks:{},cur:0,note:"",done:false};
 save();
}
const save=()=>Store.set("vl2_attempt",A);
function stats(){
 const n=A.order.length,d=A.order.filter(i=>A.ans[i]!==undefined).length;
 return{n,d,u:n-d,m:Object.values(A.marks).filter(Boolean).length};
}
function grade(){
 let ok=0,bad=0,none=0,skip=0;
 A.order.forEach(i=>{const x=q(i);
  if(x.a===null){skip++;return}
  if(A.ans[i]===undefined)none++;else if(A.ans[i]===x.a)ok++;else bad++});
 const sc=ok+bad+none;
 return{ok,bad,none,skip,score:sc?Math.round(ok/sc*1000)/100:0,pct:sc?Math.round(ok/sc*100):0};
}
function submit(){
 clearInterval(timer);A.done=true;A.end=Date.now();A.limit=A.limit;
 const g=grade();A.res=g;save();
 const h=Store.get("vl2_hist",[]);
 h.unshift({name:A.name,cls:A.cls,at:A.end,score:g.score,ok:g.ok,total:g.ok+g.bad+g.none,sec:Math.round((A.end-A.start)/1000)});
 Store.set("vl2_hist",h.slice(0,30));
 $("#modal").innerHTML="";$("#tools").hidden=true;
 show("result");
}
const fmt=s=>[s/3600|0,(s%3600)/60|0,s%60].map(v=>String(v).padStart(2,"0")).join(":");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

 const pc=i=>A.ans[i]===undefined?"":(A.mode==="study"&&q(i).a!==null)?(A.ans[i]===q(i).a?"ok":"no"):"done";
 $("#pal").innerHTML=A.order.map((i,k)=>`<button data-act="go" data-k="${k}" class="${pc(i)} ${A.marks[i]?"mk":""} ${k===A.cur?"cur":""}" aria-label="Câu ${k+1}">${k+1}</button>`).join("");
 $("#st").innerHTML=`<div><span>Tổng số câu</span><b>${st.n}</b></div><div><span>Đã trả lời</span><b>${st.d}</b></div><div><span>Chưa trả lời</span><b>${st.u}</b></div><div><span>Đã đánh dấu</span><b>${st.m}</b></div>`;
 $("#qp").innerHTML=`<h2>Câu ${A.cur+1}<span class="stats"> / ${st.n}</span></h2><p class="qtext" id="qt">${esc(x.t)}</p>${x.img?`<img src="${x.img}" alt="Hình minh họa" style="max-width:100%;border-radius:12px;margin:.4rem 0">`:""}
 ${optsHTML(id,x,p)}
 <div class="row"><button class="btn" data-act="prev" ${A.cur?"":"disabled"}>Câu trước</button>
 <button class="btn" data-act="mark">${A.marks[id]?"Bỏ đánh dấu":"Đánh dấu xem lại"}</button>
 <button class="btn" data-act="hl">Tô từ khóa</button><span class="sp"></span>
 <button class="btn pri" data-act="next" ${A.cur<st.n-1?"":"disabled"}>Câu tiếp theo</button></div>`;
 save();
}
/* Công cụ: máy tính, ghi chú, phóng to (không render lại khi chuyển câu) */
function tools(){
 const t=$("#tools");t.hidden=false;
 t.innerHTML=`<div class="card"><div class="row" style="margin:0 0 .5rem"><button class="btn" data-act="tcalc">Máy tính</button><button class="btn" data-act="tnote">Ghi chú</button><button class="btn" data-act="zoom">Phóng to</button></div>
 <div id="tp"></div></div>`;
}
let tool="";
function openTool(w){
 tool=tool===w?"":w;const p=$("#tp");
 if(tool==="calc"){p.innerHTML=`<input id="cd" type="text" inputmode="decimal" placeholder="VD: 340/2000" aria-label="Biểu thức"><div class="calc" style="margin-top:.4rem">${["7","8","9","/","4","5","6","*","1","2","3","-","0",".","(",")","π","C","+","="].map(k=>`<button class="btn" data-act="ck" data-v="${k}">${k}</button>`).join("")}</div>`}
 else if(tool==="note"){p.innerHTML=`<textarea id="nt" placeholder="Ghi chú nhanh..." aria-label="Ghi chú"></textarea>`;$("#nt").value=A.note||"";$("#nt").oninput=e=>{A.note=e.target.value;save()}}
 else p.innerHTML="";
}
function calc(v){
 const d=$("#cd");
 if(v==="C")d.value="";
 else if(v==="="){try{const e=d.value.replace(/π/g,"Math.PI").replace(/,/g,".");if(!/^[0-9+\-*/().\sMathPI]*$/.test(e))throw 0;const r=Function('"use strict";return ('+e+')')();d.value=Number.isFinite(r)?+r.toPrecision(10):"Lỗi"}catch(e){d.value="Lỗi"}}
 else d.value+=v;
}
function highlight(){
 const s=getSelection();if(!s.rangeCount||s.isCollapsed)return alert("Hãy bôi đen từ khóa trong nội dung câu hỏi trước.");
 const r=s.getRangeAt(0);if(!$("#qt").contains(r.commonAncestorContainer))return;
 const m=document.createElement("mark");try{r.surroundContents(m)}catch(e){}s.removeAllRanges();
}
function ask(){
 const s=stats();
 $("#modal").innerHTML=`<div class="modal"><div class="card" role="dialog" aria-modal="true"><h2>Xác nhận nộp bài</h2>
 <table><tr><td>Tổng số câu</td><td>${s.n}</td></tr><tr><td>Đã trả lời</td><td>${s.d}</td></tr><tr><td>Chưa trả lời</td><td>${s.u}</td></tr><tr><td>Đánh dấu xem lại</td><td>${s.m}</td></tr></table>
 ${s.u?`<div class="flagbox">Còn ${s.u} câu chưa trả lời. Câu bỏ trống bị tính là sai.</div>`:""}
 <div class="row"><button class="btn" data-act="close">Tiếp tục làm bài</button><span class="sp"></span><button class="btn acc" data-act="submit">Xác nhận nộp bài</button></div></div></div>`;
}
function viewResult(){
 const g=A.res,sec=Math.round((A.end-A.start)/1000);
 $("#app").innerHTML=`<section class="card"><h1>Kết quả: ${EXAM.title}</h1><p>${esc(A.name)} · Lớp ${esc(A.cls)}${A.school?" · "+esc(A.school):""}</p>
 <div class="grid g3" style="align-items:end"><div><div class="score">${String(g.score).replace(".",",")}</div><div class="stats">điểm / 10</div></div>
 <div class="stat"><b>${g.pct}%</b>câu trả lời đúng</div><div class="stat"><b>${fmt(sec)}</b>thời gian hoàn thành</div></div>
 <table style="margin-top:1rem"><tr><td>Số câu đúng</td><td>${g.ok}</td></tr><tr><td>Số câu sai</td><td>${g.bad}</td></tr><tr><td>Chưa trả lời</td><td>${g.none}</td></tr>
 ${g.skip?`<tr><td>Câu chưa có đáp án xác nhận (không tính điểm)</td><td>${g.skip}</td></tr>`:""}</table>
 <p class="stats">Điểm = số câu đúng / số câu được chấm × 10.</p>
 <div class="row noprint"><button class="btn pri" data-act="review">Xem toàn bộ lời giải</button><button class="btn" data-act="retry">Làm lại bài thi</button><button class="btn" data-act="home">Về trang chủ</button><button class="btn" data-act="print">In / lưu PDF</button></div></section>`;
}
function viewReview(){
 $("#app").innerHTML=`<div class="row noprint" style="margin:0 0 1rem"><button class="btn" data-act="result">Quay lại kết quả</button><button class="btn" data-act="print">In / lưu PDF</button></div>`+
 A.order.map((id,k)=>{const x=q(id),p=A.perm[id],a=A.ans[id];
  const st=x.a===null?"Chưa có đáp án xác nhận":a===undefined?"Chưa trả lời":a===x.a?"Đúng":"Sai";
  return `<section class="card" style="margin-bottom:1rem"><h3>Câu ${k+1} – ${st}</h3><p class="qtext">${esc(x.t)}</p>${x.img?`<img src="${x.img}" alt="Hình minh họa" style="max-width:100%;border-radius:12px;margin:.4rem 0">`:""}
  ${p.map((o,i)=>`<div class="opt ${x.a===o?"good":a===o?"bad":""}"><i>${L[i]}</i><span>${esc(x.o[o])}${x.a===o?" <b>(đáp án đúng)</b>":""}${a===o?" <em>(bạn chọn)</em>":""}</span></div>`).join("")}
  ${x.flag?`<div class="flagbox"><b>Cần hiệu đính:</b> ${esc(x.flag)}</div>`:""}
  ${x.s===NOSOL?"":`<details><summary>Xem lời giải</summary><p>${x.s}</p></details>`}</section>`}).join("");
}

/* ============ 5. SỰ KIỆN ============ */
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
 if(a==="start"){
  const name=$("#nm").value.trim(),cls=$("#cl").value.trim();
  if(name.length<2||!cls){$("#er").textContent="Nhập họ và tên và lớp trước khi bắt đầu.";return}
  const u={name,cls,school:$("#sc").value.trim()};Store.set("vl2_user",u);
  newAttempt(u,$("#sh").checked,document.querySelector('input[name=md]:checked').value);show("exam");
 }
 else if(a==="resume")show("exam");
 else if(a==="go"){A.cur=+b.dataset.k;draw()}
 else if(a==="pick"){const i=A.order[A.cur];if(A.mode==="study"&&A.checked[i])return;A.ans[i]=+b.dataset.o;if(A.mode==="study")A.checked[i]=true;draw()}
 else if(a==="prev"){A.cur--;draw()}else if(a==="next"){A.cur++;draw()}
 else if(a==="mark"){const i=A.order[A.cur];A.marks[i]=!A.marks[i];draw()}
 else if(a==="hl")highlight();
 else if(a==="tcalc")openTool("calc");else if(a==="tnote")openTool("note");
 else if(a==="zoom")document.body.classList.toggle("zoom");
 else if(a==="ck")calc(b.dataset.v);
 else if(a==="ask")ask();else if(a==="close")$("#modal").innerHTML="";
 else if(a==="submit")submit();
 else if(a==="review")show("review");else if(a==="result")show("result");
 else if(a==="retry"){newAttempt({name:A.name,cls:A.cls,school:A.school},false,A.mode);show("exam")}
 else if(a==="home"){show("home")}
 else if(a==="print")window.print();
 else if(a==="json"){const u=URL.createObjectURL(new Blob([JSON.stringify(BANK,null,2)],{type:"application/json"}));const l=document.createElement("a");l.href=u;l.download="ngan-hang-cau-hoi.json";l.click();URL.revokeObjectURL(u)}
});
$("#tools").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="cd")calc("=")});
window.addEventListener("beforeunload",()=>{if(A&&!A.done)save()});
/* Khởi động: nếu có bài làm dở thì vào thẳng bài thi (không mất đáp án khi tải lại) */
if(A&&!A.done&&(A.mode==="study"||Date.now()-A.start<A.limit*1000))show("exam");
else{if(A&&!A.done&&!A.res){submit()}else show("home")}
</script>
</body>
</html>
